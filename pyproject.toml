[project]
name = "leyllana"
version = "0.1.0"
description = "Decodificador de leyes y boletines chilenos en lenguaje llano. Local-first, soberano por defecto."
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
authors = [{ name = "Felipe Carvajal Brown" }]
# Runtime deps are intentionally empty for the Phase-1 skeleton: every module
# imports and the CLI runs, but the I/O layers are stubs. The heavy Phase-1
# dependencies live in the optional groups below and are imported lazily inside
# the functions that use them, so `uv sync` stays fast and nothing network- or
# model-related runs on import.
dependencies = []

[project.optional-dependencies]
# The local engine drives the external `llama-server` binary as a subprocess and
# talks to it over loopback HTTP with the standard library (ADR 0016), so it needs
# no Python dependency here -- only the binary + a GGUF, both config-driven. A
# future in-process backend would reintroduce `llama-cpp-python` as its own extra.
pdf = ["PyMuPDF>=1.24"]
# URL fetch (BCN/leychile XML, Senado/Camara HTML) uses the standard library
# (urllib + html.parser + ElementTree), so it needs no pip dependency either.
# OCR fallback for scanned PDFs (ADR 0011): Tesseract via pytesseract, Poppler
# rasterization via pdf2image. Needs the Tesseract and Poppler system binaries
# installed separately; these are only the Python bindings.
ocr = ["pytesseract>=0.3.13", "pdf2image>=1.17", "pillow>=11"]
# Desktop GUI (ADR 0002) plus the embedded terminal backend (ADR 0004). Kept out
# of the base install so a headless CLI or server use stays as light as it is
# today: PySide6 alone is a few hundred MB of Qt. `pywinpty` is Windows-only and
# the terminal panel degrades to a clear message everywhere else.
gui = ["PySide6>=6.7", "pywinpty>=2.0; sys_platform == 'win32'"]

[project.scripts]
leyllana = "leyllana.cli:main"
# Deliberately a console script and not a `gui-scripts` entry: a windowless
# launcher would swallow tracebacks, and until the Phase-4 installer exists the
# console is where a failed model load or a missing binary becomes visible.
leyllana-gui = "leyllana.gui:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leyllana"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
