<svg width="220" height="220" viewBox="0 0 220 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="leyllana - Germen Digital Socialista">
  <title>leyllana - Germen Digital Socialista</title>

  <!-- soil / base line -->
  <path d="M54 168 H166" stroke="#7a1518" stroke-width="6" stroke-linecap="round" opacity="0.85"/>

  <!-- seed -->
  <ellipse cx="110" cy="176" rx="15" ry="9" fill="#7a1518"/>

  <!-- stem: grows from the seed up -->
  <path d="M110 172 C110 150 110 128 110 96" stroke="#c1121f" stroke-width="7" stroke-linecap="round"/>

  <!-- left leaf: a circuit-veined sprout leaf -->
  <path d="M110 128 C86 128 60 118 50 92 C78 88 104 100 110 128 Z" fill="#d62828"/>
  <path d="M110 128 C92 120 74 108 58 96" stroke="#ffe0e0" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
  <circle cx="58" cy="96" r="4.2" fill="#ffe0e0"/>
  <circle cx="80" cy="112" r="3" fill="#ffe0e0"/>

  <!-- right leaf: circuit-veined -->
  <path d="M110 116 C134 112 162 98 172 70 C142 68 116 84 110 116 Z" fill="#c1121f"/>
  <path d="M110 116 C130 104 150 90 168 74" stroke="#ffe0e0" stroke-width="2.4" stroke-linecap="round" opacity="0.9"/>
  <circle cx="168" cy="74" r="4.2" fill="#ffe0e0"/>
  <circle cx="146" cy="90" r="3" fill="#ffe0e0"/>

  <!-- top sprout node: the "germ/seed" digital spark -->
  <circle cx="110" cy="88" r="9" fill="#c1121f"/>
  <circle cx="110" cy="88" r="3.6" fill="#ffe0e0"/>

  <!-- small ascending data ticks along the stem (digital growth) -->
  <path d="M110 150 H126" stroke="#d62828" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="130" cy="150" r="2.6" fill="#d62828"/>
  <path d="M110 138 H92" stroke="#d62828" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  <circle cx="88" cy="138" r="2.6" fill="#d62828"/>
</svg>
