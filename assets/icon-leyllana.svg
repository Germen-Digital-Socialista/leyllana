<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="leyllana">
  <title>leyllana</title>

  <!-- Variante para el icono de la ventana y la barra de tareas. Es el mismo
       motivo que logo-leyllana.svg (el germen de GDS con un libro delante) pero
       reducido a cinco formas: a 16x16 las venas de circuito, los ticks de datos
       y los renglones de las paginas desaparecen, y lo unico que queda si se
       dejan es suciedad. Aqui la silueta tiene que aguantar sola. -->

  <!-- tallo -->
  <path d="M32 46 V22" stroke="#c1121f" stroke-width="5" stroke-linecap="round"/>

  <!-- hojas -->
  <path d="M32 33 C24 33 16 29 13 20 C22 19 30 24 32 33 Z" fill="#d62828"/>
  <path d="M32 28 C40 26 48 21 51 12 C42 11 34 18 32 28 Z" fill="#c1121f"/>

  <!-- nodo: la chispa digital -->
  <circle cx="32" cy="14" r="5" fill="#c1121f"/>

  <!-- libro abierto, delante -->
  <path d="M32 44 C26 40 17 37 8 38 L8 51 C17 50 26 53 32 57 Z" fill="#ffe0e0" stroke="#7a1518" stroke-width="4" stroke-linejoin="round"/>
  <path d="M32 44 C38 40 47 37 56 38 L56 51 C47 50 38 53 32 57 Z" fill="#ffe0e0" stroke="#7a1518" stroke-width="4" stroke-linejoin="round"/>
</svg>
